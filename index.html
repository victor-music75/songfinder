<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Identificador de Música - ACRCloud</title>
    
    <script src="https://unpkg.com/wavesurfer.js@7/dist/wavesurfer.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>

    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background-color: #0a0a0a; color: #e0e0e0; min-height: 100vh; padding: 20px; }
        .container { max-width: 1200px; margin: 0 auto; }
        header { text-align: center; margin-bottom: 40px; padding-top: 20px; }
        h1 { font-size: 2.5rem; background: linear-gradient(90deg, #00ffff, #00ccff); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 10px; }
        .subtitle { color: #aaa; font-size: 1.1rem; }
        .main-content { display: grid; grid-template-columns: 1fr 1fr; gap: 30px; margin-bottom: 40px; }
        @media (max-width: 768px) { .main-content { grid-template-columns: 1fr; } }
        .upload-section, .recording-section { background: rgba(30, 30, 30, 0.8); border-radius: 15px; padding: 30px; box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5); border: 1px solid #222; }
        .section-title { font-size: 1.4rem; margin-bottom: 20px; color: #00ffff; display: flex; align-items: center; gap: 10px; }
        .drop-area { border: 3px dashed #444; border-radius: 10px; padding: 40px 20px; text-align: center; cursor: pointer; transition: all 0.3s ease; background: rgba(20, 20, 20, 0.5); }
        .drop-area:hover, .drop-area.drag-over { border-color: #00ffff; background: rgba(0, 255, 255, 0.05); }
        .file-input { display: none; }
        .btn-record { background: linear-gradient(135deg, #00c6ff, #0072ff); color: white; border: none; padding: 15px 30px; font-size: 1.1rem; border-radius: 50px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; transition: transform 0.2s; margin-top: 15px; }
        .btn-record.recording { animation: pulse 1.5s infinite; background: linear-gradient(135deg, #ff416c, #ff4b2b); }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(255, 75, 43, 0); } 100% { box-shadow: 0 0 0 0 rgba(255, 75, 43, 0); } }
        .wave-container { height: 100px; margin: 20px 0; background: rgba(10, 10, 10, 0.5); border-radius: 8px; overflow: hidden; }
        .result-card { background: rgba(30, 30, 30, 0.9); border-radius: 15px; padding: 30px; border: 1px solid #222; display: none; margin-top: 20px; }
        .result-header { display: flex; gap: 25px; align-items: center; }
        .album-art { width: 150px; height: 150px; border-radius: 10px; object-fit: cover; }
        .track-info { flex: 1; }
        .track-title { font-size: 1.8rem; color: #00ffff; margin-bottom: 5px; }
        .track-artist { font-size: 1.2rem; color: #fff; margin-bottom: 15px; }
        .btn-youtube { background: #ff0000; color: white; border: none; padding: 10px 20px; border-radius: 50px; cursor: pointer; margin-top: 10px; display: inline-flex; align-items: center; gap: 8px; font-weight: bold; }
        .status-message { text-align: center; color: #00ffff; margin-bottom: 20px; font-weight: bold; padding: 10px; background: rgba(0,255,255,0.1); border-radius: 8px; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Identificador de Música</h1>
            <p class="subtitle">Reconoce canciones con ACRCloud API</p>
        </header>

        <div id="globalStatus"></div>

        <div class="main-content">
            <div class="upload-section">
                <h2 class="section-title">📁 Subir Archivo</h2>
                <div class="drop-area" id="dropArea">
                    <p>Arrastra audio/video o haz clic aquí</p>
                    <input type="file" id="fileInput" class="file-input" accept="audio/*,video/*">
                </div>
                <div class="wave-container"><div id="waveform-upload"></div></div>
            </div>

            <div class="recording-section">
                <h2 class="section-title">🎤 Grabar Audio</h2>
                <button class="btn-record" id="recordButton">Escuchar Ahora (5 seg)</button>
                <div class="wave-container"><div id="waveform-record"></div></div>
            </div>
        </div>

        <div class="result-card" id="resultCard">
            <div class="result-header">
                <img id="albumArt" class="album-art" src="" alt="Portada">
                <div class="track-info">
                    <h2 id="trackTitle" class="track-title">Título</h2>
                    <p id="trackArtist" class="track-artist">Artista</p>
                    <p id="trackYear" class="track-year"></p>
                    <button class="btn-youtube" id="youtubeButton">▶️ Ver en YouTube</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ==========================================
        // ⚠️ PON TUS CLAVES AQUÍ ABAJO ⚠️
        // ==========================================
        const ACR_HOST = "identify-eu-west-1.acrcloud.com"; // Asegúrate que este sea tu host correcto
        const ACR_ACCESS_KEY = "rMw59VJeG6IWOzogOxICnWCySH5Tr8n7X7tZZXVD";
        const ACR_ACCESS_SECRET = "23eb3ccade60c1048e5352d9ed7109d8";
        // ==========================================

        let wavesurferUpload, wavesurferRecord, mediaRecorder, recordedChunks = [];

        function initWavesurfer() {
            const config = {
                waveColor: '#00ffff',
                progressColor: '#0077ff',
                barWidth: 3,
                height: 80,
                cursorWidth: 0,
            };
            wavesurferUpload = WaveSurfer.create({ ...config, container: '#waveform-upload' });
            wavesurferRecord = WaveSurfer.create({ ...config, container: '#waveform-record' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            initWavesurfer();
            setupListeners();
        });

        function setupListeners() {
            const dropArea = document.getElementById('dropArea');
            const fileInput = document.getElementById('fileInput');

            dropArea.onclick = () => fileInput.click();
            fileInput.onchange = (e) => processFile(e.target.files[0]);
            document.getElementById('recordButton').onclick = toggleRecording;
            document.getElementById('youtubeButton').onclick = openYouTube;

            dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('drag-over'); };
            dropArea.ondragleave = () => dropArea.classList.remove('drag-over');
            dropArea.ondrop = (e) => {
                e.preventDefault();
                processFile(e.dataTransfer.files[0]);
            };
        }

        async function processFile(file) {
            if (!file) return;
            showStatus('Procesando archivo...');
            
            // Visualizar
            const url = URL.createObjectURL(file);
            await wavesurferUpload.load(url);
            
            // Decodificar audio
            const arrayBuffer = await file.arrayBuffer();
            const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            const decodedData = await audioCtx.decodeAudioData(arrayBuffer);
            
            // MEJORA IMPORTANTE: Recortar solo los primeros 12 segundos para no enviar archivos gigantes
            const duration = 12; // segundos
            const sampleRate = decodedData.sampleRate;
            const samplesToKeep = Math.min(decodedData.length, duration * sampleRate);
            
            // Enviamos los datos recortados
            const pcmData = convertToPcm(decodedData, samplesToKeep);
            identifyMusic(pcmData);
        }

        async function toggleRecording() {
            if (mediaRecorder && mediaRecorder.state === "recording") return;
            
            showStatus('Escuchando...');
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                mediaRecorder = new MediaRecorder(stream);
                recordedChunks = [];

                mediaRecorder.ondataavailable = e => recordedChunks.push(e.data);
                mediaRecorder.onstop = async () => {
                    const blob = new Blob(recordedChunks, { type: 'audio/webm' }); // WebM es el standard de grabación web
                    const arrayBuffer = await blob.arrayBuffer();
                    const audioCtx = new AudioContext();
                    const decoded = await audioCtx.decodeAudioData(arrayBuffer);
                    
                    // Convertir toda la grabación (ya dura 5 segs)
                    identifyMusic(convertToPcm(decoded, decoded.length));
                    
                    // Apagar micrófono
                    stream.getTracks().forEach(t => t.stop());
                };

                mediaRecorder.start();
                document.getElementById('recordButton').classList.add('recording');
                document.getElementById('recordButton').innerText = "🔴 Escuchando...";
                
                setTimeout(() => {
                    if(mediaRecorder.state === "recording") {
                        mediaRecorder.stop();
                        document.getElementById('recordButton').classList.remove('recording');
                        document.getElementById('recordButton').innerText = "🎤 Escuchar Ahora (5 seg)";
                    }
                }, 5000);
            } catch (err) {
                showStatus("Error: No se pudo acceder al micrófono.");
                console.error(err);
            }
        }

        function convertToPcm(audioBuffer, length) {
            // Extraemos solo el canal izquierdo (mono) y solo la longitud necesaria
            const float32Data = audioBuffer.getChannelData(0);
            const int16Data = new Int16Array(length);
            
            for (let i = 0; i < length; i++) {
                // Convertir de float (-1.0 a 1.0) a int16 (-32768 a 32767)
                const s = Math.max(-1, Math.min(1, float32Data[i]));
                int16Data[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }
            return int16Data.buffer;
        }

        async function identifyMusic(pcmBuffer) {
            showStatus('Consultando base de datos...');
            const timestamp = Math.floor(Date.now() / 1000);
            const stringToSign = `POST\n/identify\n${ACR_ACCESS_KEY}\naudio\n1\n${timestamp}`;
            const signature = CryptoJS.HmacSHA1(stringToSign, ACR_ACCESS_SECRET).toString(CryptoJS.enc.Base64);

            const formData = new FormData();
            formData.append('access_key', ACR_ACCESS_KEY);
            formData.append('data_type', 'audio');
            formData.append('signature', signature);
            formData.append('signature_version', '1');
            formData.append('timestamp', timestamp);
            formData.append('sample', new Blob([pcmBuffer]), 'sample.pcm');

            try {
                const res = await fetch(`https://${ACR_HOST}/v1/identify`, { method: 'POST', body: formData });
                const data = await res.json();
                displayResult(data);
            } catch (err) {
                showStatus('Error de conexión con ACRCloud (Revisa consola)');
                console.error(err);
            }
        }

        function displayResult(data) {
            hideStatus();
            console.log(data); // Para depurar
            if (data.status && data.status.code === 0 && data.metadata && data.metadata.music) {
                const m = data.metadata.music[0];
                document.getElementById('resultCard').style.display = 'block';
                document.getElementById('trackTitle').innerText = m.title;
                document.getElementById('trackArtist').innerText = m.artists.map(a => a.name).join(', ');
                document.getElementById('trackYear').innerText = m.release_date || "";
                
                // Imagen: Usamos la real si existe, sino un placeholder
                if (m.album && m.album.images && m.album.images.length > 0) {
                     document.getElementById('albumArt').src = m.album.images[0].url;
                } else {
                     document.getElementById('albumArt').src = "https://placehold.co/150x150/222/00ffff?text=No+Image";
                }

                // Configurar botón YouTube
                document.getElementById('youtubeButton').onclick = () => {
                    const query = encodeURIComponent(`${m.title} ${m.artists[0].name}`);
                    window.open(`https://www.youtube.com/results?search_query=${query}`, '_blank');
                };
            } else {
                alert("No se encontró coincidencia o hubo un error (Revisa tus claves).");
            }
        }

        function openYouTube() {
            // Placeholder si hacen click sin canción
        }

        function showStatus(msg) { 
            document.getElementById('globalStatus').innerHTML = `<div class="status-message">${msg}</div>`; 
        }
        function hideStatus() { 
            document.getElementById('globalStatus').innerHTML = ''; 
        }
    </script>
</body>
</html>
